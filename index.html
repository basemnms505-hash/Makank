<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكانك - سوق الرياض</title><meta name="theme-color" content="#0A0A0A"><style>:root{--bg:#0A0A0A;--card:#161616;--green:#00FF88}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:var(--bg);color:#fff}header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.logo{display:flex;gap:8px;align-items:center;font-weight:900;font-size:22px}.logo-icon{width:32px;height:32px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900}.search{margin:12px 16px;background:var(--card);border-radius:12px;display:flex;align-items:center;padding:10px 14px;gap:10px}.search input{flex:1;background:transparent;border:0;color:#fff;outline:none}.cats{display:flex;gap:8px;overflow:auto;padding:0 16px 8px}.cat{background:#161616;border:1px solid #222;padding:8px 16px;border-radius:20px;white-space:nowrap;cursor:pointer;font-size:14px}.cat.active{background:#00FF88;color:#000;font-weight:700}.banner{margin:12px 16px;background:linear-gradient(135deg,#00FF88,#00CC6A);color:#000;padding:16px;border-radius:16px;display:flex;justify-content:space-between}.grid{padding:0 16px 100px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid #222}.card img{width:100%;height:140px;object-fit:cover}.card .info{padding:10px}.price{color:var(--green);font-weight:800;font-size:13px;margin:4px 0}.fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;border:0;padding:14px 28px;border-radius:30px;font-weight:900;box-shadow:0 8px 20px rgba(0,255,136,.3);cursor:pointer;z-index:20}#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;align-items:center;justify-content:center;padding:16px}#modal.on{display:flex}.form{background:#161616;width:100%;max-width:420px;border-radius:20px;padding:20px;border:1px solid #2a2a2a}.form input,.form textarea,.form select{width:100%;background:#0A0A0A;border:1px solid #2a2a2a;border-radius:12px;padding:12px;margin:6px 0;color:#fff}.btn-save{width:100%;background:var(--green);color:#000;border:0;padding:14px;border-radius:12px;font-weight:900;margin-top:10px;cursor:pointer}.btn-cancel{width:100%;background:#222;color:#fff;border:0;padding:12px;border-radius:12px;margin-top:8px}</style></head><body><header><div class="logo"><div class="logo-icon">م</div>مكانك</div><div style="font-size:12px;color:#888">الرياض</div></header><div class="search"><span>🔍</span><input id="searchInput" placeholder="ابحث..." oninput="render()"></div><div class="cats" id="cats"><div class="cat active" onclick="filterCat('الكل',this)">الكل</div><div class="cat" onclick="filterCat('شقق',this)">شقق</div><div class="cat" onclick="filterCat('سيارات',this)">سيارات</div><div class="cat" onclick="filterCat('جوالات',this)">جوالات</div></div><div class="banner"><div><b>أضف إعلانك الآن</b><div style="font-size:12px">وصل لآلاف المشترين</div></div><div>🚀</div></div><div class="grid" id="adsGrid"></div><button class="fab" onclick="openModal()">+ أضف إعلان</button><div id="modal"><div class="form"><h3>إعلان جديد</h3><select id="f_cat"><option>شقق</option><option>سيارات</option><option>جوالات</option><option>أثاث</option></select><input id="f_title" placeholder="العنوان"><input id="f_price" placeholder="السعر"><input id="f_phone" placeholder="واتساب 9665xxxxxxx"><input id="f_img" placeholder="رابط الصورة اختياري"><textarea id="f_desc" rows="2" placeholder="الوصف"></textarea><button class="btn-save" onclick="saveAd()">نشر الآن</button><button class="btn-cancel" onclick="closeModal()">إلغاء</button></div></div><script>let curCat='الكل';let ads=JSON.parse(localStorage.getItem('makank_v3')||'[]');if(!ads.length){ads=[{cat:'شقق',title:'شقة للإيجار حي الملز',price:'2500 ريال',phone:'966500000000',img:'https://picsum.photos/400/300?1',desc:'غرفتين وصالة',time:Date.now()}];}function openModal(){document.getElementById('modal').classList.add('on')}function closeModal(){document.getElementById('modal').classList.remove('on')}function filterCat(c,el){curCat=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');render();}function render(){const q=document.getElementById('searchInput').value.toLowerCase();const grid=document.getElementById('adsGrid');let list=ads.filter(a=>{let okCat=curCat==='الكل'||a.cat===curCat;let okSearch=!q||a.title.toLowerCase().includes(q);return okCat&&okSearch;});if(!list.length){grid.innerHTML='<p style="grid-column:1/-1;text-align:center;color:#555;margin-top:40px">لا يوجد إعلانات</p>';return}grid.innerHTML=list.map(a=>`<div class="card"><img src="${a.img||'https://picsum.photos/400/300'}" onerror="this.src='https://via.placeholder.com/400'"><div class="info"><h4>${a.title}</h4><div class="price">${a.price}</div><p style="color:#888;font-size:11px">${a.cat}</p><button onclick="window.open('https://wa.me/${a.phone}','_blank')" style="width:100%;margin-top:8px;background:#25D366;color:#fff;border:0;padding:8px;border-radius:8px;font-weight:700">واتساب</button></div></div>`).join('');}function saveAd(){const cat=document.getElementById('f_cat').value,title=document.getElementById('f_title').value.trim(),price=document.getElementById('f_price').value.trim(),phone=document.getElementById('f_phone').value.trim().replace(/[^0-9]/g,''),img=document.getElementById('f_img').value.trim(),desc=document.getElementById('f_desc').value.trim();if(!title||!price||!phone){alert('اكتب العنوان والسعر والواتساب');return}ads.unshift({cat,title,price,phone,img,desc,time:Date.now()});localStorage.setItem('makank_v3',JSON.stringify(ads));closeModal();['f_title','f_price','f_phone','f_img','f_desc'].forEach(id=>document.getElementById(id).value='');render();}render();</script></body></html>
