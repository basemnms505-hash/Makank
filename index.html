<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Makank - مكانك</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Tajawal',sans-serif;background:#f5f7fb}
.scrollbar-hide::-webkit-scrollbar{display:none}
.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}
</style>
</head>
<body>

<div style="max-width:480px;margin:0 auto;background:#f5f7fb;min-height:100vh;padding-bottom:20px;">

  <!-- الهيدر -->
  <div style="background:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;">
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="width:36px;height:36px;background:#2563EB;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;">م</div>
      <span style="font-weight:800;font-size:18px;">مكانك</span>
    </div>
    <div style="width:36px;height:36px;background:#f1f5f9;border-radius:50%;display:flex;align-items:center;justify-content:center;">🔍</div>
  </div>

  <!-- شريط الأقسام - نفس الشكل الحلو اللي كان عاجبك -->
  <div style="padding:12px 8px;">
    <div style="display:flex;flex-direction:row;gap:12px;overflow-x:auto;flex-wrap:nowrap;padding:6px;" class="scrollbar-hide">
      
      <button style="min-width:90px;height:90px;background:#2563EB;color:#fff;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:none;flex-shrink:0;box-shadow:0 4px 12px rgba(37,99,235,0.3);">
        <span style="font-size:26px">🏠</span><span style="font-size:13px;font-weight:800;margin-top:6px">الرئيسية</span>
      </button>

      <button style="min-width:85px;height:85px;background:#fff;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;border:1px solid #eef1f5;box-shadow:0 3px 10px rgba(0,0,0,0.06);">
        <span style="font-size:24px">🚗</span><span style="font-size:12px;font-weight:700;margin-top:4px">سيارات</span>
      </button>
      <button style="min-width:85px;height:85px;background:#fff;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;border:1px solid #eef1f5;box-shadow:0 3px 10px rgba(0,0,0,0.06);">
        <span style="font-size:24px">🏢</span><span style="font-size:12px;font-weight:700;margin-top:4px">عقارات</span>
      </button>
      <button style="min-width:85px;height:85px;background:#fff;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;border:1px solid #eef1f5;box-shadow:0 3px 10px rgba(0,0,0,0.06);">
        <span style="font-size:24px">📱</span><span style="font-size:12px;font-weight:700;margin-top:4px">اجهزة</span>
      </button>
      <button style="min-width:85px;height:85px;background:#fff;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;border:1px solid #eef1f5;box-shadow:0 3px 10px rgba(0,0,0,0.06);">
        <span style="font-size:24px">🛋️</span><span style="font-size:12px;font-weight:700;margin-top:4px">اثاث</span>
      </button>
      <button style="min-width:85px;height:85px;background:#fff;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;border:1px solid #eef1f5;box-shadow:0 3px 10px rgba(0,0,0,0.06);">
        <span style="font-size:24px">💼</span><span style="font-size:12px;font-weight:700;margin-top:4px">وظائف</span>
      </button>

    </div>
  </div>

  <!-- محتوى مؤقت لحد ما ترجع اعلاناتك -->
  <div style="padding:40px 20px;text-align:center;color:#94a3b8;">
    <div style="font-size:48px;margin-bottom:12px;">📦</div>
    <div style="font-weight:700;color:#334155;">الموقع شغال تاني!</div>
    <div style="font-size:13px;margin-top:6px;">الإعلانات هتظهر هنا</div>
  </div>

</div>

</body>
</html>
