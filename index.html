<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكانك</title>
<style>
:root{--bg:#0A0A0A;--card:#161616;--border:#242424;--green:#00FF88;--blue:#3B82F6}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--bg);color:#fff;padding-bottom:90px}
header{position:sticky;top:0;z-index:100;background:#161616f2;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px}
.logo-icon{width:34px;height:34px;background:var(--green);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#000}
.icon-btn{width:38px;height:38px;background:#222;border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;padding:8px 0 12px;z-index:999}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:#666;font-size:11px;flex:1}
.nav-item.active{color:var(--blue)}
.nav-item .nav-icon{font-size:23px}
.plus-btn{width:60px;height:60px;background:var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;margin-top:-22px;border:4px solid #0A0A0A}
#loginScreen{position:fixed;inset:0;background:#0A0A0A;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#161616;width:100%;max-width:380px;padding:28px;border-radius:20px;border:1px solid var(--border);text-align:center}
.login-box input{width:100%;padding:14px 16px;margin-bottom:12px;border-radius:12px;border:1px solid var(--border);background:#1E1E1E;color:#fff;outline:none}
.login-box button{width:100%;padding:16px;background:var(--green);border:0;border-radius:12px;font-weight:900;color:#000;cursor:pointer;font-size:17px}
#profileScreen,#addScreen,#favScreen,#msgScreen,#notifScreen,#detailScreen{position:fixed;inset:0;background:#0A0A0A;z-index:9998;display:none;overflow:auto;padding-bottom:90px}
.profile-header{padding:16px;display:flex;gap:12px;border-bottom:1px solid var(--border);background:#161616}
.profile-header button{background:#222;border:1px solid var(--border);color:#fff;width:40px;height:40px;border-radius:12px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.card{background:#161616;border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:140px;object-fit:cover}
.card .info{padding:10px}
.card .price{color:var(--green);font-weight:900}
.search-wrap{margin:14px 16px;background:#161616;border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;gap:10px}
.search-wrap input{flex:1;background:transparent;border:0;color:#fff;outline:none}
.cats{display:flex;gap:8px;overflow:auto;padding:0 16px 10px}
.cat{white-space:nowrap;background:#161616;border:1px solid var(--border);padding:9px 18px;border-radius:22px;font-size:14px;cursor:pointer}
.cat.active{background:var(--green);color:#000;font-weight:700}
</style>
</head>
<body>
<div id="loginScreen"><div class="login-box"><div class="logo" style="justify-content:center;margin-bottom:12px"><div class="logo-icon">م</div> مكانك</div><h2>مرحبا في مكانك</h2><input id="userName" value="باسم السيد" style="margin-top:20px"><input id="userPhone" value="0578701979"><input id="userEmail" value="basemnms505@gmail.com"><button onclick="directLogin()">🚀 دخول مباشر للموقع</button><p style="color:#666;font-size:11px;margin-top:10px">بدون كود - دخول فوري</p></div></div>
<header><div class="logo"><div class="logo-icon">م</div> مكانك</div><div class="icon-btn" onclick="openProfile()">👤</div></header>
<div class="search-wrap"><span>🔍</span><input id="searchInput" placeholder="ابحث..." oninput="renderAds()"></div>
<div class="cats" id="catsContainer"></div>
<div class="grid" id="adsGrid" style="margin-top:10px"></div>
<div class="bottom-nav">
  <div class="nav-item active" id="nav-home" onclick="location.reload()"><div class="nav-icon">🏠</div><span>الرئيسية</span></div>
  <div class="nav-item" onclick="openFavs()"><div class="nav-icon">❤️</div><span>المفضلة</span></div>
  <div class="nav-item" onclick="openAdd()" style="flex:0"><div class="plus-btn">+</div></div>
  <div class="nav-item" onclick="openNotifs()"><div class="nav-icon">🔔</div><span>الإشعارات</span></div>
  <div class="nav-item" onclick="openMessages()"><div class="nav-icon">✉️</div><span>الرسائل</span></div>
</div>
<div id="profileScreen"><div class="profile-header"><button onclick="closeAll()">✕</button><b>البروفايل</b></div><div style="text-align:center;padding:20px"><div id="avatarLetter" style="width:80px;height:80px;background:#00FF88;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#000;margin:0 auto;font-weight:900">ب</div><h3 id="profileName" style="margin-top:10px"></h3><div style="background:#161616;border:1px solid #333;border-radius:12px;padding:12px;margin:16px;text-align:right"><p id="pName"></p><p id="pPhone" style="direction:ltr;text-align:right"></p><p id="pEmail" style="direction:ltr;text-align:right"></p></div><button onclick="logout()" style="width:90%;padding:14px;background:#ff3b30;border:0;border-radius:12px;color:#fff;font-weight:800;margin-top:10px">🚪 تسجيل خروج</button><br><button onclick="closeAll()" style="width:90%;padding:14px;background:#222;border:1px solid #333;border-radius:12px;color:#fff;margin-top:10px">اغلاق</button></div></div>
<div id="detailScreen" style="position:fixed;inset:0;background:#0A0A0A;z-index:9997;display:none"><div style="position:relative"><img id="detailImg" style="width:100%;height:300px;object-fit:cover"><button onclick="closeDetail()" style="position:absolute;top:12px;right:12px;width:40px;height:40px;background:rgba(0,0,0,0.7);border-radius:12px;border:0;color:#fff">✕</button></div><div style="background:#161616;margin-top:-20px;border-radius:24px 24px 0 0;padding:20px;position:relative"><div id="detailTitle" style="font-weight:800;font-size:18px"></div><div id="detailPrice" style="color:#00FF88;font-weight:900;font-size:22px;margin:10px 0"></div><div id="detailDesc" style="background:#1E1E1E;border:1px solid #333;border-radius:12px;padding:14px;color:#ccc"></div><div style="display:flex;gap:10px;margin-top:14px"><button onclick="startChat()" style="flex:1;background:#3B82F6;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:800">💬 خاص</button><button onclick="openWhatsApp()" style="flex:1;background:#25D366;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:800">🟢 واتساب</button></div></div></div>
<div id="addScreen"><div class="profile-header"><button onclick="closeAll()">✕</button><b>اضف اعلان</b></div><div style="padding:16px"><input id="adTitle" placeholder="عنوان الاعلان"><input id="adPrice" placeholder="السعر"><button onclick="publishAd()" style="width:100%;padding:14px;background:#00FF88;border:0;border-radius:12px;font-weight:900;margin-top:10px">نشر</button></div></div>
<div id="favScreen"><div class="profile-header"><button onclick="closeAll()">✕</button><b>المفضلة</b></div><div class="grid" id="favGrid" style="margin-top:12px"></div></div>
<div id="msgScreen"><div class="profile-header"><button onclick="closeAll()">✕</button><b>الرسائل</b></div><div style="text-align:center;padding:40px;color:#666">لا يوجد رسائل</div></div>
<div id="notifScreen"><div class="profile-header"><button onclick="closeAll()">✕</button><b>الإشعارات</b></div><div style="text-align:center;padding:40px;color:#666">لا يوجد إشعارات</div></div>
<script>
let currentCat="الكل";const categories=["الكل","شقق","سيارات","موبايلات","أثاث","وظائف","خدمات","أخرى"];
let defaultAds=[{cat:"شقق",title:"شقة للايجار الرياض",price:"2,500 ر.س",img:"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=600",city:"الرياض",phone:"966500000000",desc:"شقة مفروشة"},{cat:"سيارات",title:"تويوتا كامري 2022",price:"75,000 ر.س",img:"https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600",city:"جدة",phone:"966500000000",desc:"نظيفة"},{cat:"موبايلات",title:"ايفون 15 برو ماكس",price:"4,200 ر.س",img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=600",city:"الرياض",phone:"966500000000",desc:"جديد"}];
function getAds(){let s=JSON.parse(localStorage.getItem('makank_ads')||'[]');return [...s,...defaultAds];}
document.getElementById('catsContainer').innerHTML=categories.map(c=>`<div class="cat ${c===currentCat?'active':''}" onclick="setCat('${c}',this)">${c}</div>`).join('');
function setCat(c,el){currentCat=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderAds()}
let currentDetailAd=null;
function renderAds(){let all=getAds();let q=document.getElementById('searchInput').value.toLowerCase();let f=all.filter(a=>{let mc=currentCat==="الكل"||a.cat===currentCat;let mq=a.title.toLowerCase().includes(q);return mc&&mq});document.getElementById('adsGrid').innerHTML=f.map(a=>`<div class="card" onclick="openDetail('${a.title.replace(/'/g,"\\'")}')"><img src="${a.img}"><div class="info"><div style="font-size:13px">${a.title}</div><div class="price">${a.price}</div></div></div>`).join('')}
renderAds();
function openDetail(t){let ad=getAds().find(x=>x.title===t);if(!ad)return;currentDetailAd=ad;document.getElementById('detailImg').src=ad.img;document.getElementById('detailTitle').innerText=ad.title;document.getElementById('detailPrice').innerText=ad.price;document.getElementById('detailDesc').innerText=ad.desc;document.getElementById('detailScreen').style.display="block"}
function closeDetail(){document.getElementById('detailScreen').style.display="none"}
function openWhatsApp(){if(currentDetailAd)window.open('https://wa.me/'+currentDetailAd.phone+'?text=بخصوص: '+currentDetailAd.title,'_blank')}
function startChat(){alert("تم فتح الخاص - الميزة قيد التطوير")}
function directLogin(){let n=document.getElementById('userName').value.trim()||"باسم";let p=document.getElementById('userPhone').value.trim()||"0578701979";let e=document.getElementById('userEmail').value.trim()||"a@a.com";localStorage.setItem('makank_user',JSON.stringify({name:n,phone:p,email:e}));document.getElementById('loginScreen').style.display="none";loadProfileData();alert("✅ تم الدخول")}
function checkLogin(){if(localStorage.getItem('makank_user')){document.getElementById('loginScreen').style.display="none";loadProfileData()}}checkLogin();
function closeAll(){['profileScreen','addScreen','favScreen','msgScreen','notifScreen','detailScreen'].forEach(id=>{let el=document.getElementById(id);if(el)el.style.display='none'})}
function openProfile(){closeAll();loadProfileData();document.getElementById('profileScreen').style.display="block"}
function openFavs(){closeAll();document.getElementById('favScreen').style.display="block"}
function openMessages(){closeAll();document.getElementById('msgScreen').style.display="block"}
function openNotifs(){closeAll();document.getElementById('notifScreen').style.display="block"}
function openAdd(){document.getElementById('addScreen').style.display="block"}
function loadProfileData(){let u=JSON.parse(localStorage.getItem('makank_user')||'{}');if(!u.name)return;document.getElementById('profileName').innerText=u.name;document.getElementById('pName').innerText="👤 "+u.name;document.getElementById('pPhone').innerText="📞 "+u.phone;document.getElementById('pEmail').innerText="✉️ "+u.email;document.getElementById('avatarLetter').innerText=u.name.charAt(0)}
function logout(){localStorage.removeItem('makank_user');location.reload()}
function publishAd(){let t=document.getElementById('adTitle').value;let p=document.getElementById('adPrice').value;if(!t||!p){alert("اكمل البيانات");return}let n={cat:"أخرى",title:t,price:p,img:"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=600",city:"الرياض",phone:"966500000000",desc:t};let s=JSON.parse(localStorage.getItem('makank_ads')||'[]');s.unshift(n);localStorage.setItem('makank_ads',JSON.stringify(s));closeAll();renderAds();alert("تم النشر")}
</script>
</body>
</html>
