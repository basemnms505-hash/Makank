<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوق الإعلانات - مصر</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:sans-serif;padding:12px}
input,textarea,select{width:100%;padding:10px;margin-bottom:8px;border-radius:8px;border:1px solid #333;background:#1c1c1c;color:#fff;box-sizing:border-box}
button{padding:10px 14px;border:none;border-radius:8px;background:#25D366;color:#000;font-weight:bold;cursor:pointer}
.card{background:#1c1c1c;padding:12px;border-radius:12px;margin-bottom:12px}
.card img{width:100%;border-radius:10px;margin-top:8px}
.hidden{display:none}
.tab{padding:10px;background:#222;border-radius:8px;cursor:pointer;text-align:center;flex:1}
.tab.active{background:#25D366;color:#000}
</style>
</head>
<body>

<h2>🛒 سوق الإعلانات - مصر 🇪🇬</h2>

<!-- تسجيل الدخول -->
<div id="loginBox" class="card">
  <div id="loginForm">
    <h3>تسجيل الدخول</h3>
    <input id="loginName" placeholder="الاسم">
    <input id="loginPhone" placeholder="رقم الجوال - مثال 01012345678">
    <input id="loginEmail" placeholder="الإيميل">
    <button onclick="doLogin()" style="width:100%">دخول</button>
  </div>
  <div id="userInfo" class="hidden">
    أهلاً <b><span id="userNameShow"></span></b> - <span id="userEmailShow"></span><br><br>
    <button onclick="doLogout()">خروج</button>
  </div>
</div>

<!-- التبويبات -->
<div style="display:flex;gap:8px;margin-bottom:12px">
  <div class="tab active" id="tabAll" onclick="showTab('all')">كل الإعلانات</div>
  <div class="tab" id="tabMy" onclick="showTab('my')">إعلاناتي</div>
  <div class="tab" id="tabAdd" onclick="showTab('add')">انشر إعلان</div>
</div>

<!-- فلتر المحافظة -->
<div class="card">
  <select id="filterCity" onchange="render()">
    <option value="">كل المحافظات</option>
    <option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option><option>الدقهلية</option><option>الشرقية</option><option>الغربية</option><option>المنوفية</option><option>القليوبية</option><option>البحيرة</option><option>كفر الشيخ</option><option>دمياط</option><option>بورسعيد</option><option>الإسماعيلية</option><option>السويس</option><option>الفيوم</option><option>بني سويف</option><option>المنيا</option><option>أسيوط</option><option>سوهاج</option><option>قنا</option><option>الأقصر</option><option>أسوان</option><option>البحر الأحمر</option><option>مطروح</option><option>شمال سيناء</option><option>جنوب سيناء</option><option>الوادي الجديد</option>
  </select>
</div>

<div id="viewAll"></div>
<div id="viewMy" class="hidden"></div>

<!-- نشر -->
<div id="viewAdd" class="hidden">
  <div class="card">
    <h3>انشر إعلان جديد</h3>
    <input id="fTitle" placeholder="عنوان الإعلان">
    <input id="fPrice" placeholder="السعر بالجنيه" type="number">
    <select id="fCity">
      <option value="">اختر المحافظة</option>
      <option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option><option>الدقهلية</option><option>الشرقية</option><option>الغربية</option><option>المنوفية</option><option>القليوبية</option><option>البحيرة</option><option>كفر الشيخ</option><option>دمياط</option><option>بورسعيد</option><option>الإسماعيلية</option><option>السويس</option><option>الفيوم</option><option>بني سويف</option><option>المنيا</option><option>أسيوط</option><option>سوهاج</option><option>قنا</option><option>الأقصر</option><option>أسوان</option><option>البحر الأحمر</option><option>مطروح</option><option>شمال سيناء</option><option>جنوب سيناء</option><option>الوادي الجديد</option>
    </select>
    <textarea id="fDesc" placeholder="وصف الإعلان"></textarea>
    <label>اختار صور الإعلان (ممكن كذا صورة):</label>
    <input type="file" id="fImage" accept="image/*" multiple onchange="previewImage(event)">
    <div id="imgPreview" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"></div>
    <button onclick="addAd()" style="width:100%">نشر الإعلان</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
// ===== حط هنا الـ Firebase Config بتاعك القديم =====
const firebaseConfig = {
  apiKey: "حط_بتاعتك",
  authDomain: "حط_بتاعتك",
  projectId: "حط_بتاعتك",
  storageBucket: "حط_بتاعتك",
  messagingSenderId: "حط_بتاعتك",
  appId: "حط_بتاعتك"
};
// =================================================
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ===== تسجيل الدخول =====
let user = JSON.parse(localStorage.getItem('user') || 'null');
function saveUser(){ localStorage.setItem('user', JSON.stringify(user)); }
function doLogin(){
  let n = document.getElementById('loginName').value.trim();
  let p = document.getElementById('loginPhone').value.trim();
  let e = document.getElementById('loginEmail').value.trim();
  if(!n || !p || !e) return alert('اكتب الاسم والجوال والإيميل');
  user = {name:n, phone:p, email:e};
  saveUser();
  updateLoginUI();
  alert('تم الدخول أهلاً '+n);
}
function doLogout(){
  user = null;
  localStorage.removeItem('user');
  updateLoginUI();
}
function updateLoginUI(){
  let logged = !!user;
  document.getElementById('loginForm').classList.toggle('hidden', logged);
  document.getElementById('userInfo').classList.toggle('hidden', !logged);
  if(logged){
    document.getElementById('userNameShow').textContent = user.name;
    document.getElementById('userEmailShow').textContent = user.email;
    document.getElementById('loginName').value = user.name;
    document.getElementById('loginPhone').value = user.phone;
    document.getElementById('loginEmail').value = user.email;
  }
}
updateLoginUI();

// ===== تبويبات =====
function showTab(t){
  document.getElementById('viewAll').classList.toggle('hidden', t!=='all');
  document.getElementById('viewMy').classList.toggle('hidden', t!=='my');
  document.getElementById('viewAdd').classList.toggle('hidden', t!=='add');
  document.getElementById('tabAll').classList.toggle('active', t==='all');
  document.getElementById('tabMy').classList.toggle('active', t==='my');
  document.getElementById('tabAdd').classList.toggle('active', t==='add');
  if(t==='my') renderMy();
}

// ===== صور متعددة =====
let selectedImages = [];
function previewImage(e){
  let files = e.target.files;
  selectedImages = [];
  let box = document.getElementById('imgPreview');
  box.innerHTML = '';
  [...files].forEach(file=>{
    let reader = new FileReader();
    reader.onload = function(ev){
      selectedImages.push(ev.target.result);
      let img = document.createElement('img');
      img.src = ev.target.result;
      img.style.width = '80px';
      img.style.height = '80px';
      img.style.objectFit = 'cover';
      img.style.borderRadius = '8px';
      box.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
}

// ===== نشر =====
async function addAd(){
  try{
    if(!user) return alert('سجل دخول الأول بالاسم والجوال والإيميل');
    let title = document.getElementById('fTitle').value.trim();
    let price = document.getElementById('fPrice').value.trim();
    let desc = document.getElementById('fDesc').value.trim();
    let city = document.getElementById('fCity').value;
    if(!title) return alert('اكتب عنوان الإعلان');
    if(!city) return alert('اختر المحافظة');
    await db.collection("ads").add({
      title:title,
      price:price,
      desc:desc,
      city:city,
      images:selectedImages,
      image: selectedImages[0] || '',
      ownerName:user.name,
      ownerPhone:user.phone,
      ownerEmail:user.email,
      createdAt: new Date().toISOString(),
      createdAtNum: Date.now()
    });
    document.getElementById('fTitle').value='';
    document.getElementById('fPrice').value='';
    document.getElementById('fDesc').value='';
    document.getElementById('fCity').value='';
    document.getElementById('fImage').value='';
    selectedImages=[];
    document.getElementById('imgPreview').innerHTML='';
    alert('تم نشر إعلانك للكل 🎉');
    showTab('all');
  }catch(e){ alert('خطأ في النشر : '+e.message); }
}

// ===== عرض الكل =====
function getImagesHtml(a){
  let imgs = a.images && a.images.length ? a.images : (a.image ? [a.image] : []);
  return imgs.map(im=>`<img src="${im}" style="width:80px;height:80px;object-fit:cover;border-radius:8px">`).join('');
}
function render(){
  let filter = document.getElementById('filterCity').value;
  let q = db.collection("ads").orderBy("createdAtNum","desc");
  q.onSnapshot(snap=>{
    let html = '';
    snap.forEach(doc=>{
      let a = doc.data();
      if(filter && a.city !== filter) return;
      html += `<div class="card">
        <b>${a.title||''}</b> - ${a.price||''} جنيه<br>
        <small>📍 ${a.city||''}</small><br>
        <small>${a.desc||''}</small><br>
        <small>بواسطة: ${a.ownerName||''} - ${a.ownerPhone||''}</small>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${getImagesHtml(a)}</div>
        <br><button onclick="contactOwner('${a.ownerPhone||''}')">تواصل واتساب</button>
      </div>`;
    });
    document.getElementById('viewAll').innerHTML = html || '<p>لا توجد إعلانات بعد</p>';
  });
}
function contactOwner(phone){
  if(!phone) return alert('لا يوجد رقم');
  let p = phone.replace(/\D/g,'');
  if(p.startsWith('0')) p = '20' + p.substring(1);
  if(!p.startsWith('20')) p = '20' + p;
  window.open('https://wa.me/'+p);
}

// ===== اعلاناتي =====
function renderMy(){
  if(!user) return document.getElementById('viewMy').innerHTML = '<p>سجل دخول عشان تشوف إعلاناتك</p>';
  db.collection("ads").where("ownerPhone","==",user.phone).orderBy("createdAtNum","desc").onSnapshot(snap=>{
    let html = '';
    snap.forEach(doc=>{
      let a = doc.data();
      html += `<div class="card">
        <b>${a.title||''}</b> - ${a.price||''} جنيه<br>
        <small>📍 ${a.city||''}</small><br>
        <small>${a.desc||''}</small>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${getImagesHtml(a)}</div>
        <br><br><button onclick="delAd('${doc.id}')" style="background:#ff4444;color:#fff">حذف</button>
      </div
