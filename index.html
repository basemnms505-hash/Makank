<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوق الإعلانات - مصر</title>
<style>
*{box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:sans-serif;padding:12px;margin:0}
h2{text-align:center}
input,textarea,select{width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:1px solid #333;background:#1c1c1c;color:#fff}
button{padding:11px 14px;border:none;border-radius:10px;background:#25D366;color:#000;font-weight:bold;cursor:pointer}
.card{background:#1c1c1c;padding:14px;border-radius:16px;margin-bottom:14px}
.card img.main{width:100%;height:220px;object-fit:cover;border-radius:12px;margin:10px 0}
.price{color:#25D366;font-weight:bold;font-size:19px}
.tab{padding:12px;background:#222;border-radius:10px;cursor:pointer;text-align:center;flex:1;font-weight:bold}
.tab.active{background:#25D366;color:#000}
.cat{padding:8px 14px;background:#222;border-radius:20px;cursor:pointer;font-size:14px;white-space:nowrap}
.cat.active{background:#25D366;color:#000;font-weight:bold}
.hidden{display:none}
.login{text-align:center}
.badge{background:#333;padding:4px 10px;border-radius:20px;font-size:12px}
</style>
</head>
<body>
<h2>🛒 سوق الإعلانات - مصر 🇪🇬</h2>
<div id="loginBox" class="card login">
  <div id="loginForm">
    <h3 style="margin-top:0">تسجيل الدخول</h3>
    <input id="loginName" placeholder="الاسم">
    <input id="loginPhone" placeholder="رقم الجوال - مثال 01012345678">
    <input id="loginEmail" placeholder="الإيميل">
    <button onclick="doLogin()" style="width:100%">دخول</button>
  </div>
  <div id="userInfo" class="hidden">
    <div>أهلاً <b><span id="userNameShow"></span></b></div>
    <div style="color:#aaa;margin:6px 0"><span id="userEmailShow"></span></div>
    <button onclick="doLogout()">خروج</button>
  </div>
</div>
<div style="display:flex;gap:8px;margin-bottom:12px">
  <div class="tab active" id="tabAll" onclick="showTab('all')">كل الإعلانات</div>
  <div class="tab" id="tabMy" onclick="showTab('my')">إعلاناتي</div>
  <div class="tab" id="tabAdd" onclick="showTab('add')">انشر إعلان</div>
</div>
<div class="card">
  <input id="searchInput" placeholder="🔍 ابحث باسم الإعلان..." oninput="render()">
  <select id="filterCity" onchange="render()">
    <option value="">كل المحافظات</option>
    <option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option><option>الدقهلية</option><option>الشرقية</option><option>الغربية</option><option>المنوفية</option><option>القليوبية</option><option>البحيرة</option><option>كفر الشيخ</option><option>دمياط</option><option>بورسعيد</option><option>الإسماعيلية</option><option>السويس</option><option>الفيوم</option><option>بني سويف</option><option>المنيا</option><option>أسيوط</option><option>سوهاج</option><option>قنا</option><option>الأقصر</option><option>أسوان</option><option>البحر الأحمر</option><option>مطروح</option><option>شمال سيناء</option><option>جنوب سيناء</option><option>الوادي الجديد</option>
  </select>
  <div id="cats" style="display:flex;gap:8px;overflow-x:auto;padding:4px 0"></div>
</div>
<div id="viewAll"></div>
<div id="viewMy" class="hidden"></div>
<div id="viewAdd" class="hidden">
  <div class="card">
    <h3 style="margin-top:0">انشر إعلان جديد</h3>
    <input id="fTitle" placeholder="عنوان الإعلان">
    <input id="fPrice" placeholder="السعر بالجنيه" type="number">
    <select id="fCat">
      <option value="">اختر القسم</option>
      <option>سيارات</option><option>عقارات</option><option>موبايلات</option><option>إلكترونيات</option><option>أثاث</option><option>ملابس</option><option>وظائف</option><option>أخرى</option>
    </select>
    <select id="fCity">
      <option value="">اختر المحافظة</option>
      <option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option><option>الدقهلية</option><option>الشرقية</option><option>الغربية</option><option>المنوفية</option><option>القليوبية</option><option>البحيرة</option><option>كفر الشيخ</option><option>دمياط</option><option>بورسعيد</option><option>الإسماعيلية</option><option>السويس</option><option>الفيوم</option><option>بني سويف</option><option>المنيا</option><option>أسيوط</option><option>سوهاج</option><option>قنا</option><option>الأقصر</option><option>أسوان</option><option>البحر الأحمر</option><option>مطروح</option><option>شمال سيناء</option><option>جنوب سيناء</option><option>الوادي الجديد</option>
    </select>
    <textarea id="fDesc" placeholder="وصف الإعلان" rows="3"></textarea>
    <label>اختار صور الإعلان:</label>
    <input type="file" id="fImage" accept="image/*" multiple onchange="previewImage(event)">
    <div id="imgPreview" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"></div>
    <button onclick="addAd()" style="width:100%;font-size:16px">نشر الإعلان 🚀</button>
  </div>
</div>

<script>
// ==== الدخول والأقسام شغالين لوحدهم من غير Firebase ====
let user = null;
try{ user = JSON.parse(localStorage.getItem('user') || 'null'); }catch(e){ user=null; }
let selectedCat = "";
let allAds = [];
let categories = ["الكل","سيارات","عقارات","موبايلات","إلكترونيات","أثاث","ملابس","وظائف","أخرى"];

function renderCats(){
  let box = document.getElementById('cats');
  if(!box) return;
  box.innerHTML = categories.map(function(c){
    let active = (c==="الكل" && selectedCat==="") || c===selectedCat ? 'active' : '';
    let val = c==="الكل" ? "" : c;
    return '<div class="cat '+active+'" onclick="setCat(\''+val+'\')">'+c+'</div>';
  }).join('');
}
function setCat(v){ selectedCat = v; renderCats(); render(); }
function doLogin(){
  let n = document.getElementById('loginName').value.trim();
  let p = document.getElementById('loginPhone').value.trim();
  let e = document.getElementById('loginEmail').value.trim();
  if(!n || !p || !e){ alert('اكتب الاسم والجوال والإيميل'); return; }
  user = {name:n, phone:p, email:e};
  try{ localStorage.setItem('user', JSON.stringify(user)); }catch(err){}
  updateLoginUI();
  alert('تم الدخول أهلاً '+n);
}
function doLogout(){ user=null; try{localStorage.removeItem('user');}catch(e){} updateLoginUI(); }
function updateLoginUI(){
  let logged = !!user;
  document.getElementById('loginForm').classList.toggle('hidden', logged);
  document.getElementById('userInfo').classList.toggle('hidden', !logged);
  if(logged){
    document.getElementById('userNameShow').textContent = user.name;
    document.getElementById('userEmailShow').textContent = user.email;
    document.getElementById('loginName').value = user.name;
    document.getElementById('loginPhone').value = user.phone;
    document.getElementById('loginEmail').value = user.email;
  }
}
function showTab(t){
  document.getElementById('viewAll').classList.toggle('hidden', t!=='all');
  document.getElementById('viewMy').classList.toggle('hidden', t!=='my');
  document.getElementById('viewAdd').classList.toggle('hidden', t!=='add');
  document.getElementById('tabAll').classList.toggle('active', t==='all');
  document.getElementById('tabMy').classList.toggle('active', t==='my');
  document.getElementById('tabAdd').classList.toggle('active', t==='add');
  if(t==='my') renderMy();
}
renderCats();
updateLoginUI();
</script>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
let db = null;
try{
  const firebaseConfig = {
    apiKey: "AIzaSyDMEEIf_ZolyqRvQGOxMj4apSJAnwIom1w",
    authDomain: "makank-48b39.firebaseapp.com",
    projectId: "makank-48b39",
    storageBucket: "makank-48b39.firebasestorage.app",
    messagingSenderId: "925625587864",
    appId: "1:925625587864:web:f17ef5be707a7be91598ed",
    measurementId: "G-ZJX8XKD6ZZ"
  };
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}catch(e){ console.log("Firebase error", e); }

let selectedImages = [];
function previewImage(e){
  let files = e.target.files;
  selectedImages = [];
  let box = document.getElementById('imgPreview');
  box.innerHTML = '';
  Array.from(files).forEach(function(file){
    let reader = new FileReader();
    reader.onload = function(ev){
      selectedImages.push(ev.target.result);
      let img = document.createElement('img');
      img.src = ev.target.result;
      img.style.width='80px'; img.style.height='80px'; img.style.objectFit='cover'; img.style.borderRadius='8px';
      box.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
}
async function addAd(){
  try{
    if(!user) return alert('سجل دخول الأول');
    if(!db) return alert('Firebase مش شغال، اتأكد من النت و Rules');
    let title = document.getElementById('fTitle').value.trim();
    let price = document.getElementById('fPrice').value.trim();
    let desc = document.getElementById('fDesc').value.trim();
    let city = document.getElementById('fCity').value;
    let cat = document.getElementById('fCat').value;
    if(!title) return alert('اكتب عنوان الإعلان');
    if(!cat) return alert('اختر القسم');
    if(!city) return alert('اختر المحافظة');
    await db.collection("ads").add({
      title:title, price:price, desc:desc, city:city, category:cat,
      images:selectedImages, image: selectedImages[0] || '',
      ownerName:user.name, ownerPhone:user.phone, ownerEmail:user.email,
      createdAt: new Date().toISOString(), createdAtNum: Date.now()
    });
    document.getElementById('fTitle').value='';
    document.getElementById('fPrice').value='';
    document.getElementById('fDesc').value='';
    document.getElementById('fCity').value='';
    document.getElementById('fCat').value='';
    document.getElementById('fImage').value='';
    selectedImages=[]; document.getElementById('imgPreview').innerHTML='';
    alert('تم نشر إعلانك للكل 🎉'); showTab('all');
  }catch(e){ alert('خطأ في النشر : '+e.message); }
}
function cardHtml(a, id, showDelete){
  let imgs = a.images && a.images.length ? a.images : (a.image ? [a.image] : []);
  let mainImg = imgs.length ? '<img class="main" src="'+imgs[0]+'">' : '';
  let thumbs = imgs.slice(1).map(function(im){ return '<img src="'+im+'" style="width:70px;height:70px;object-fit:cover;border-radius:8px">'; }).join('');
  let delBtn = showDelete ? '<button onclick="delAd(\''+id+'\')" style="background:#ff4444;color:#fff">حذف</button>' : '';
  return '<div class="card"><div style="display:flex;justify-content:space-between"><span class="badge">'+(a.category||'أخرى')+'</span><span class="badge">📍 '+(a.city||'')+'</span></div><div style="font-size:19px;font-weight:bold;margin-top:10px">'+(a.title||'')+'</div><div class="price">'+(a.price||'')+' جنيه</div>'+mainImg+'<div style="display:flex;gap:6px;flex-wrap:wrap">'+thumbs+'</div><div style="color:#ccc;margin:8px 0">'+(a.desc||'')+'</div><div style="font-size:13px;color:#aaa">بواسطة: '+(a.ownerName||'')+' - '+(a.ownerPhone||'')+'</div><div style="display:flex;gap:8px;margin-top:12px"><button onclick="contactOwner(\''+(a.ownerPhone||'')+'\')" style="flex:1">💬 واتساب</button>'+delBtn+'</div></div>';
}
function filterAds(list){
  let q = document.getElementById('searchInput').value.toLowerCase().trim();
  let city = document.getElementById('filterCity').value;
  return list.filter(function(a){
    if(city && a.city !== city) return false;
    if(selectedCat && a.category !== selectedCat) return false;
    if(q && !((a.title||'').toLowerCase().includes(q)) && !((a.desc||'').toLowerCase().includes(q))) return false;
    return true;
  });
}
if(db){
  db.collection("ads").orderBy("createdAtNum","desc").onSnapshot(function(snap){
    allAds = [];
    snap.forEach(function(doc){ let d=doc.data(); d.id=doc.id; allAds.push(d); });
    render();
  }, function(err){ console.log(err); });
}
function render(){
  let list = filterAds(allAds);
  document.getElementById('viewAll').innerHTML = list.map(function(a){ return cardHtml(a,a.id,false); }).join('') || '<p style="text-align:center;color:#aaa">لا توجد إعلانات في الفلتر ده</p>';
}
function contactOwner(phone){
  if(!phone) return alert('لا يوجد رقم');
  let p = phone.replace(/\D/g,'');
  if(p.startsWith('0')) p = '20' + p.substring(1);
  if(!p.startsWith('20')) p = '20' + p;
  window.open('https://wa.me/'+p);
}
function renderMy(){
  if(!user) return document.getElementById('viewMy').innerHTML = '<p>سجل دخول عشان تشوف إعلاناتك</p>';
  let list = allAds.filter(function(a){ return a.ownerPhone===user.phone; });
  list = filterAds(list);
  document.getElementById('viewMy').innerHTML = list.map(function(a){ return cardHtml(a,a.id,true); }).join('') || '<p>ماعندك إعلانات لسه</p>';
}
async function delAd(id){
  if(!confirm('متأكد تحذف؟')) return;
  await db.collection("ads").doc(id).delete();
}
render();
</script>
</body>
</html>
