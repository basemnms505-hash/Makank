<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>مكانك</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0A0A0A;color:#fff}header{padding:14px;background:#161616;display:flex;justify-content:space-between;border-bottom:1px solid #222}.logo{font-weight:900;font-size:22px;display:flex;gap:8px}.logo-icon{width:32px;height:32px;background:#00FF88;color:#000;border-radius:8px;display:flex;align-items:center;justify-content:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}.card{background:#161616;border-radius:14px;overflow:hidden;border:1px solid #222}.card img{width:100%;height:110px;object-fit:cover}.info{padding:8px}.price{color:#00FF88;font-weight:800}#loginScreen{position:fixed;inset:0;background:#0A0A0A;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px}.box{background:#161616;width:100%;max-width:360px;padding:25px;border-radius:16px;border:1px solid #222}.box input{width:100%;padding:13px;margin-bottom:10px;border-radius:12px;border:0;background:#222;color:#fff}.box button{width:100%;padding:13px;background:#00FF88;border:0;border-radius:12px;font-weight:900}</style></head><body><div id="loginScreen"><div class="box"><h2 style="text-align:center">مرحبا في مكانك</h2><p style="color:#888;text-align:center;margin:10px 0 18px;font-size:14px">سجل عشان تدخل</p><div id="s1"><input id="n" placeholder="اسمك"><input id="p" placeholder="رقم التليفون"><input id="e" placeholder="الايميل"><button onclick="send()">أرسل كود التحقق</button></div><div id="s2" style="display:none"><p style="text-align:center">كودك: <span id="c" style="color:#00FF88;font-size:22px;font-weight:900"></span></p><input id="i" placeholder="ادخل الكود" style="margin-top:15px"><button onclick="verify()">تأكيد ودخول</button></div></div></div><header><div class="logo"><div class="logo-icon">م</div>مكانك</div></header><div class="grid" id="grid"></div><script>let ads=[{t:"شقة للإيجار بالرياض",pr:"2,500 ر.س",img:"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=400"},{t:"تويوتا كامري 2022",pr:"75,000 ر.س",img:"https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=400"},{t:"ايفون 15 برو ماكس",pr:"4,200 ر.س",img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=400"},{t:"شقة تمليك فاخرة",pr:"650,000 ر.س",img:"https://images.unsplash.com/photo-1502005229762-cf1b2da7c5d6?w=400"}];document.getElementById('grid').innerHTML=ads.map(a=>`<div class="card"><img src="${a.img}"><div class="info"><div>${a.t}</div><div class="price">${a.pr}</div></div></div>`).join('');let code="";function send(){let n=document.getElementById('n').value,p=document.getElementById('p').value,e=document.getElementById('e').value;if(n==""||p==""||e==""){alert("اكمل البيانات");return;}code=Math.floor(100000+Math.random()*900000).toString();document.getElementById('c').innerText=code;document.getElementById('s1').style.display="none";document.getElementById('s2').style.display="block";localStorage.setItem('temp',JSON.stringify({name:n,phone:p,email:e}));}function verify(){let i=document.getElementById('i').value;if(i==code){let u=JSON.parse(localStorage.getItem('temp'));localStorage.setItem('makank_user',JSON.stringify(u));document.getElementById('loginScreen').style.display="none";alert("أهلا "+u.name);}else{alert("الكود غلط");}}if(localStorage.getItem('makank_user')){document.getElementById('loginScreen').style.display="none";}</script></body></html>
