<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكانك - سوق الاعلانات</title>
<style>
:root{--bg:#0A0A0A;--card:#161616;--border:#242424;--green:#00FF88;--gray:#888}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--bg);color:#fff;padding-bottom:90px}
header{position:sticky;top:0;z-index:100;background:#161616f2;backdrop-filter:blur(10px);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px}
.logo-icon{width:34px;height:34px;background:var(--green);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900}
.icon-btn{width:38px;height:38px;background:#222;border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.search-wrap{margin:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.search-wrap input{flex:1;background:transparent;border:0;color:#fff;outline:none;font-size:15px}
.cats{display:flex;gap:8px;overflow:auto;padding:0 16px 10px}
.cat{white-space:nowrap;background:var(--card);border:1px solid var(--border);padding:9px 18px;border-radius:22px;font-size:14px;cursor:pointer}
.cat.active{background:var(--green);color:#000;border-color:var(--green);font-weight:700}
.banner{margin:12px 16px;background:linear-gradient(135deg,#00FF88,#00CC6A);color:#000;padding:16px;border-radius:16px;display:flex;justify-content:space-between;align-items:center}
.banner button{background:#000;color:var(--green);border:0;padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.card img{width:100%;height:130px;object-fit:cover}
.card .info{padding:10px}
.card .title{font-size:13px;line-height:1.3;height:34px;overflow:hidden}
.card .price{color:var(--green);font-weight:900;margin-top:6px;font-size:14px}
.card .meta{color:var(--gray);font-size:11px;margin-top:4px}
#loginScreen{position:fixed;inset:0;background:#0A0A0A;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);width:100%;max-width:380px;padding:28px;border-radius:20px;border:1px solid var(--border);text-align:center}
.login-box input{width:100%;padding:14px 16px;margin-bottom:12px;border-radius:12px;border:1px solid var(--border);background:#1E1E1E;color:#fff;font-size:15px}
.login-box button{width:100%;padding:14px;background:var(--green);border:0;border-radius:12px;font-weight:900;color:#000}
.code{font-size:32px;font-weight:900;color:var(--green);letter-spacing:6px;margin:10px 0}
#profileScreen,#addScreen{position:fixed;inset:0;background:#0A0A0A;z-index:9999;display:none;overflow:auto}
.profile-header{padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0}
.profile-header button{background:#222;border:1px solid var(--border);color:#fff;width:36px;height:36px;border-radius:10px}
.avatar{width:72px;height:72px;background:linear-gradient(135deg,#00FF88,#00CC6A);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#000;margin:20px auto 12px}
.profile-box,.add-box{background:var(--card);margin:12px 16px;border-radius:16px;border:1px solid var(--border);padding:16px}
.profile-box input,.add-box input,.add-box select,.add-box textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#1E1E1E;color:#fff;margin-bottom:10px}
.btn-green{width:100%;padding:13px;background:var(--green);border:0;border-radius:12px;font-weight:800;color:#000;margin-top:6px}
.btn-dark{width:100%;padding:13px;background:#222;border:1px solid var(--border);border-radius:12px;color:#ff5a5a;margin-top:10px;font-weight:700}
.fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;box-shadow:0 8px 24px rgba(0,255,136,0.35);cursor:pointer;z-index:500;border:0}
</style>
</head>
<body>
<div id="loginScreen"><div class="login-box"><div class="logo" style="justify-content:center;margin-bottom:12px"><div class="logo-icon">م</div> مكانك</div><h2>مرحبا في مكانك</h2><p style="color:#888;font-size:13px;margin:8px 0 20px">سجل دخولك عشان تشوف الاعلانات</p><div id="step1"><input id="userName" placeholder="اسمك الكامل"><input id="userPhone" placeholder="رقم التليفون"><input id="userEmail" type="email" placeholder="الايميل"><button onclick="sendCode()">ارسال كود التحقق</button></div><div id="step2" style="display:none"><p style="color:#888;font-size:13px">كود التحقق الخاص بك</p><div class="code" id="showCode">------</div><input id="codeInput" placeholder="اكتب الكود هنا"><button onclick="verifyCode()">تأكيد ودخول الموقع</button></div></div></div>

<div id="profileScreen"><div class="profile-header"><button onclick="closeProfile()">✕</button><b>البروفايل الخاص بي</b></div><div class="avatar" id="avatarLetter">م</div><h3 id="profileName" style="text-align:center"></h3><div class="profile-box"><p id="pName"></p><p id="pPhone"></p><p id="pEmail"></p><hr style="border:0;border-top:1px solid #222;margin:14px 0"><input id="editName"><input id="editPhone"><input id="editEmail"><button class="btn-green" onclick="saveProfile()">حفظ</button><button class="btn-dark" onclick="logout()">تسجيل خروج</button></div></div>

<div id="addScreen"><div class="profile-header"><button onclick="closeAdd()">✕</button><b>اضف اعلان جديد</b></div><div class="add-box"><input id="adTitle" placeholder="عنوان الاعلان"><select id="adCat"><option value="شقق">شقق</option><option value="سيارات">سيارات</option><option value="موبايلات" selected>موبايلات</option><option value="أثاث">اثاث</option></select><input id="adPrice" placeholder="السعر"><input id="adCity" placeholder="المدينة"><input id="adPhone" placeholder="رقم الواتساب"><input id="adImg" placeholder="رابط الصورة https://"><textarea id="adDesc" rows="3" placeholder="وصف"></textarea><button class="btn-green" onclick="publishAd()">نشر الان 🚀</button></div></div>

<header><div class="logo"><div class="logo-icon">م</div> مكانك</div><div class="icon-btn" onclick="openProfile()">👤</div></header>
<div class="search-wrap"><span>🔍</span><input id="searchInput" placeholder="ابحث عن سيارات، شقق، موبايلات..." oninput="renderAds()"></div>
<div class="cats" id="catsContainer"></div>
<div class="banner"><div><h3>عندك حاجة للبيع؟</h3></div><button onclick="openAdd()">+ اضف</button></div>
<div class="grid" id="adsGrid"></div>
<button class="fab" onclick="openAdd()">+</button>

<script>
let currentCat="الكل";const categories=["الكل","شقق","سيارات","موبايلات","أثاث","وظائف","خدمات"];
let defaultAds=[
{cat:"شقق",title:"شقة للايجار بالرياض",price:"2,500 ر.س",img:"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=500",city:"الرياض",phone:"966500000000"},
{cat:"موبايلات",title:"ايفون 15 برو ماكس جديد",price:"4,200 ر.س",img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=500",city:"الرياض",phone:"966500000000"}
];
function getAds(){let s=JSON.parse(localStorage.getItem('makank_ads')||'[]');return [...s,...defaultAds];}
document.getElementById('catsContainer').innerHTML=categories.map(c=>`<div class="cat ${c===currentCat?'active':''}" onclick="setCat('${c}',this)">${c}</div>`).join('');
function setCat(c,el){currentCat=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderAds()}
function renderAds(){const all=getAds();document.getElementById('adsGrid').innerHTML=all.filter(a=>currentCat==="الكل"||a.cat===currentCat).map(a=>`<div class="card"><img src="${a.img}"><div class="info"><div class="title">${a.title}</div><div class="meta">${a.cat}</div><div class="price">${a.price}</div><button onclick="window.open('https://wa.me/${a.phone}','_blank')" style="width:100%;margin-top:8px;background:#25D366;color:#fff;border:0;padding:7px;border-radius:8px">واتساب</button></div></div>`).join('')}
renderAds();
let generatedCode="";function sendCode(){let n=document.getElementById('userName').value,p=document.getElementById('userPhone').value,e=document.getElementById('userEmail').value;if(n==""||p==""||e==""){alert("اكمل البيانات");return}generatedCode=Math.floor(100000+Math.random()*900000).toString();document.getElementById('showCode').innerText=generatedCode;document.getElementById('step1').style.display="none";document.getElementById('step2').style.display="block";localStorage.setItem('temp_user',JSON.stringify({name:n,phone:p,email:e}))}
function verifyCode(){if(document.getElementById('codeInput').value===generatedCode){let u=JSON.parse(localStorage.getItem('temp_user'));localStorage.setItem('makank_user',JSON.stringify(u));document.getElementById('loginScreen').style.display="none";loadProfileData()}else{alert("الكود غلط")}}
function checkLogin(){if(localStorage.getItem('makank_user')){document.getElementById('loginScreen').style.display="none"}}checkLogin();
function openProfile(){loadProfileData();document.getElementById('profileScreen').style.display="block"}
function closeProfile(){document.getElementById('profileScreen').style.display="none"}
function loadProfileData(){let u=JSON.parse(localStorage.getItem('makank_user')||'{}');if(!u.name)return;document.getElementById('profileName').innerText=u.name;document.getElementById('pName').innerText=u.name;document.getElementById('pPhone').innerText=u.phone;document.getElementById('pEmail').innerText=u.email;document.getElementById('avatarLetter').innerText=u.name.charAt(0)}
function saveProfile(){let n=document.getElementById('editName').value,p=document.getElementById('editPhone').value,e=document.getElementById('editEmail').value;localStorage.setItem('makank_user',JSON.stringify({name:n,phone:p,email:e}));loadProfileData();closeProfile()}
function logout(){localStorage.removeItem('makank_user');location.reload()}
function openAdd(){document.getElementById('addScreen').style.display="block"}
function closeAdd(){document.getElementById('addScreen').style.display="none"}
function publishAd(){let newAd={cat:document.getElementById('adCat').value,title:document.getElementById('adTitle').value,price:document.getElementById('adPrice').value,city:document.getElementById('adCity').value,phone:document.getElementById('adPhone').value,img:document.getElementById('adImg').value};let saved=JSON.parse(localStorage.getItem('makank_ads')||'[]');saved.unshift(newAd);localStorage.setItem('makank_ads',JSON.stringify(saved));closeAdd();renderAds()}
</script>
</body>
</html>
