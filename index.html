<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكانك</title>
<style>
:root{--bg:#0A0A0A;--card:#161616;--border:#242424;--green:#00FF88;--blue:#3B82F6;--gray:#888}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--bg);color:#fff;padding-bottom:90px}
header{position:sticky;top:0;z-index:100;background:#161616f2;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px}
.logo-icon{width:34px;height:34px;background:var(--green);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#000}
.icon-btn{width:38px;height:38px;background:#222;border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.search-wrap{margin:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;display:flex;gap:10px}
.search-wrap input{flex:1;background:transparent;border:0;color:#fff;outline:none}
.cats{display:flex;gap:8px;overflow:auto;padding:0 16px 10px}
.cat{white-space:nowrap;background:var(--card);border:1px solid var(--border);padding:9px 18px;border-radius:22px;font-size:14px;cursor:pointer}
.cat.active{background:var(--green);color:#000;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;position:relative}
.card img{width:100%;height:140px;object-fit:cover}
.card .info{padding:10px}
.card .price{color:var(--green);font-weight:900;margin-top:6px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;padding:8px 0 12px;z-index:999}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:#666;font-size:11px;flex:1}
.nav-item.active{color:var(--blue)}
.nav-item .nav-icon{font-size:23px}
.plus-btn{width:60px;height:60px;background:var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;margin-top:-22px;border:4px solid #0A0A0A}
#loginScreen{position:fixed;inset:0;background:#0A0A0A;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);width:100%;max-width:380px;padding:28px;border-radius:20px;border:1px solid var(--border);text-align:center}
.login-box input{width:100%;padding:14px 16px;margin-bottom:12px;border-radius:12px;border:1px solid var(--border);background:#1E1E1E;color:#fff;outline:none}
.login-box button{width:100%;padding:16px;background:var(--green);border:0;border-radius:12px;font-weight:900;color:#000;cursor:pointer;font-size:17px}
#profileScreen,#addScreen,#favScreen,#msgScreen,#notifScreen,#detailScreen,#chatScreen{position:fixed;inset:0;background:#0A0A0A;z-index:9998;display:none;overflow:auto;padding-bottom:90px}
.profile-header{padding:16px;display:flex;gap:12px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0}
.profile-header button{background:#222;border:1px solid var(--border);color:#fff;width:40px;height:40px;border-radius:12px;cursor:pointer}
.avatar{width:86px;height:86px;background:linear-gradient(135deg,#00FF88,#00CC6A);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:#000;margin:22px auto 10px}
.profile-box,.add-box{background:var(--card);margin:12px 16px;border-radius:18px;border:1px solid var(--border);padding:18px}
.profile-box input,.add-box input,.add-box select,.add-box textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);background:#1E1E1E;color:#fff;margin-bottom:12px;outline:none}
.upload-area{border:2px dashed #333;border-radius:16px;padding:22px;text-align:center;background:#1E1E1E;cursor:pointer}
#previewImg{width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-top:12px;display:none}
.btn-green{width:100%;padding:14px;background:var(--green);border:0;border-radius:14px;font-weight:900;color:#000;cursor:pointer}
.btn-red{width:100%;padding:14px;background:#ff3b30;border:0;border-radius:14px;color:#fff;margin-top:12px;font-weight:800;cursor:pointer}
.btn-gray{width:100%;padding:14px;background:#222;border:1px solid var(--border);border-radius:14px;color:#fff;margin-top:12px;cursor:pointer}
#detailScreen{position:fixed;inset:0;background:#0A0A0A;z-index:9997;display:none;overflow:auto;padding-bottom:90px}
.detail-img-wrap{position:relative;width:100%;height:320px;background:#111}
.detail-img-wrap img{width:100%;height:100%;object-fit:cover}
.detail-back{position:absolute;top:14px;right:14px;width:40px;height:40px;background:rgba(0,0,0,0.7);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
.detail-content{background:var(--card);margin:-24px 0 0;border-radius:26px 26px 0 0;padding:22px;position:relative;border-top:1px solid var(--border)}
.detail-title{font-size:19px;font-weight:800}
.detail-price{font-size:24px;font-weight:900;color:var(--green);margin:12px 0}
.detail-desc{background:#1E1E1E;border:1px solid var(--border);border-radius:14px;padding:16px;font-size:14px;line-height:1.7;color:#ccc;margin-bottom:18px}
.detail-actions{display:flex;gap:10px}
.btn-wa{flex:1;background:#25D366;color:#fff;border:0;padding:15px;border-radius:14px;font-weight:800;cursor:pointer}
.btn-chat{flex:1;background:var(--blue);color:#fff;border:0;padding:15px;border-radius:14px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="login-box">
    <div class="logo" style="justify-content:center;margin-bottom:12px"><div class="logo-icon">م</div> مكانك</div>
    <h2>مرحبا في مكانك</h2>
    <p style="color:#888;font-size:13px;margin:8px 0 20px">سجل دخولك عشان تشوف الاعلانات</p>
    <input id="userName" placeholder="اسمك الكامل" value="باسم السيد">
    <input id="userPhone" placeholder="رقم التليفون" value="0578701979">
    <input id="userEmail" type="email" placeholder="الايميل" value="basemnms505@gmail.com">
    <button onclick="directLogin()">🚀 دخول مباشر للموقع</button>
    <p style="color:#666;font-size:11px;margin-top:12px">بدون كود - هيدخل مباشرة</p>
  </div>
</div>

<div id="profileScreen">
  <div class="profile-header"><button onclick="closeAll()">✕</button><b>البروفايل</b></div>
  <div class="avatar" id="avatarLetter">ب</div>
  <h3 id="profileName" style="text-align:center"></h3>
  <div class="profile-box">
    <p id="pName"></p><p id="pPhone" style="direction:ltr;text-align:right"></p><p id="pEmail" style="direction:ltr;text-align:right"></p>
    <hr style="border:0;border-top:1px solid #333;margin:14px 0">
    <input id="editName" placeholder="الاسم"><input id="editPhone" placeholder="التليفون"><input id="editEmail" placeholder="الايميل">
    <button class="btn-green" onclick="saveProfile()">💾 حفظ التعديلات</button>
    <button class="btn-red" onclick="logout()">🚪 تسجيل خروج</button>
    <button class="btn-gray" onclick="closeAll()">اغلاق</button>
  </div>
</div>

<div id="detailScreen"><div class="detail-img-wrap"><img id="detailImg" src=""><div class="detail-back" onclick="closeDetail()">✕</div></div><div class="detail-content"><div class="detail-title" id="detailTitle"></div><div class="detail-price" id="detailPrice"></div><div class="detail-desc" id="detailDesc"></div><div class="detail-actions"><button class="btn-chat" onclick="startPrivateChat()">💬 خاص</button><button class="btn-wa" onclick="openWhatsApp()">🟢 واتساب</button></div></div></div>
<div id="addScreen"><div class="profile-header"><button onclick="closeAll()">✕</button><b>اضف اعلان</b></div><div class="add-box"><input id="adTitle" placeholder="عنوان *"><select id="adCat"><option>شقق</option><option>سيارات</option><option selected>موبايلات</option><option>أثاث</option><option>وظائف</option><option>خدمات</option><option>أخرى</option></select><input id="adPrice" placeholder="السعر *"><input id="adCity" placeholder="المدينة"><input id="adPhone" placeholder="واتساب *"><input type="file" id="adImgFile" accept="image/*" style="display:none" onchange="handleImage(this)"><div class="upload-area" onclick="document.getElementById('adImgFile').click()">📸 اختر صورة</div><img id="previewImg"><textarea id="adDesc" rows="3" placeholder="الوصف"></textarea><button class="btn-green" onclick="publishAd()">نشر الان 🚀</button></div></div>
<div id="favScreen"><div class="profile-header"><button onclick="closeAll()">✕</button><b>المفضلة</b></div><div class="grid" id="favGrid" style="margin-top:14px"></div><div id="favEmpty" style="text-align:center;padding:60px;color:#666">❤️ لا يوجد مفضلة</div></div>
<div id="msgScreen"><div class="profile-header"><button onclick="closeAll()">✕</button><b>الرسائل</b></div><div id="msgList" style="padding:14px"></div></div>
<div id="notifScreen"><div class="profile-header"><button onclick="closeAll()">✕</button><b>الإشعارات</b></div><div style="text-align:center;padding:60px;color:#666">🔔 لا يوجد إشعارات</div></div>
<div id="chatScreen"><div class="profile-header"><button onclick="closeChat()">✕</button><b id="chatWith">محادثة</b></div><div id="chatBox" style="padding:16px;display:flex;flex-direction:column;gap:10px"></div><div style="display:flex;gap:10px;padding:12px;background:#161616;position:fixed;bottom:0;left:0;right:0"><input id="chatInput" placeholder="اكتب رسالتك..." style="flex:1;padding:12px;border-radius:22px;background:#1E1E1E;border:1px solid #333;color:#fff"><button onclick="sendMsg()" style="width:44px;height:44px;background:var(--blue);border:0;border-radius:50%;color:#fff">➤</button></div></div>

<header><div class="logo"><div class="logo-icon">م</div> مكانك</div><div class="icon-btn" onclick="openProfile()">👤</div></header>
<div class="search-wrap"><span>🔍</span><input id="searchInput" placeholder="ابحث..." oninput="renderAds()"></div>
<div class="cats" id="catsContainer"></div>
<div class="grid" id="adsGrid" style="margin-top:10px"></div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="goHome()" id="nav-home"><div class="nav-icon">🏠</div><span>الرئيسية</span></div>
  <div class="nav-item" onclick="openFavs()" id="nav-fav"><div class="nav-icon">❤️</div><span>المفضلة</span></div>
  <div class="nav-item" onclick="openAdd()" style="flex:0"><div class="plus-btn">+</div></div>
  <div class="nav-item" onclick="openNotifs()" id="nav-notif"><div class="nav-icon">🔔</div><span>الإشعارات</span></div>
  <div class="nav-item" onclick="openMessages()" id="nav-msg"><div class="nav-icon">✉️</div><span>الرسائل</span></div>
</div>

<script>
let currentCat="الكل";const categories=["الكل","شقق","سيارات","موبايلات","أثاث","وظائف","خدمات","أخرى"];
let defaultAds=[
{cat:"شقق",title:"شقة للايجار بالرياض - حي الملقا",price:"2,500 ر.س",img:"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=600",city:"الرياض",phone:"966500000000",desc:"شقة مفروشة"},
{cat:"سيارات",title:"تويوتا كامري 2022",price:"75,000 ر.س",img:"https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600",city:"جدة",phone:"966500000000",desc:"نظيفة"},
{cat:"موبايلات",title:"ايفون 15 برو ماكس 256GB",price:"4,200 ر.س",img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=600",city:"الرياض",phone:"966500000000",desc:"جديد"},
{cat:"وظائف",title:"مطلوب مندوب مبيعات 6000",price:"6,000 ر.س",img:"https://images.unsplash.com/photo-1521791136064-7986c2920216?w=600",city:"الرياض",phone:"966500000000",desc:"شركة كبيرة"},
{cat:"خدمات",title:"نقل عفش بالرياض خصم 30%",price:"300 ر.س",img:"https://images.unsplash.com/photo-1600518464441-9154a4dea21b?w=600",city:"الرياض",phone:"966500000000",desc:"نقل عفش"},
{cat:"أخرى",title:"دراجة هوائية جبلية",price:"800 ر.س",img:"https://images.unsplash.com/photo-1571068316344-75bc76f77890?w=600",city:"جدة",phone:"966500000000",desc:"مقاس 26"}
];
function getAds(){let s=JSON.parse(localStorage.getItem('makank_ads')||'[]');return [...s,...defaultAds];}
document.getElementById('catsContainer').innerHTML=categories.map(c=>`<div class="cat ${c===currentCat?'active':''}" onclick="setCat('${c}',this)">${c}</div>`).join('');
function setCat(c,el){currentCat=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderAds()}
let currentDetailAd=null;
function renderAds(){const q=document.getElementById('searchInput').value.toLowerCase();const all=getAds();const favs=JSON.parse(localStorage.getItem('makank_favs')||'[]');const f=all.filter(a=>{const mc=currentCat==="الكل"||a.cat===currentCat;const mq=a.title.toLowerCase().includes(q);return mc&&mq});document.getElementById('adsGrid').innerHTML=f.map(a=>`<div class="card" onclick="openDetailByTitle('${a.title.replace(/'/g,"\\'")}')"><img src="${a.img}"><div class="fav-btn ${favs.includes(a.title)?'active':''}" onclick="event.stopPropagation();toggleFav('${a.title.replace(/'/g,"\\'")}')">❤️</div><div class="info"><div class="title">${a.title}</div><div class="price">${a.price}</div></div></div>`).join('')}
renderAds();
function openDetailByTitle(t){let ad=getAds().find(x=>x.title===t);if(!ad)return;currentDetailAd=ad;detailImg.src=ad.img;detailTitle.innerText=ad.title;detailPrice.innerText=ad.price;detailDesc.innerText=ad.desc;detailScreen.style.display="block"}
function closeDetail(){detailScreen.style.display="none"}
function openWhatsApp(){if(currentDetailAd)window.open('https://wa.me/'+currentDetailAd.phone+'?text=مرحبا بخصوص: '+currentDetailAd.title,'_blank')}
function startPrivateChat(){if(!currentDetailAd)return;closeDetail();chatWith.innerText=currentDetailAd.title;chatBox.innerHTML=`<div style="background:#161616;border:1px solid #333;padding:12px;border-radius:14px;max-width:80%">مرحبا بخصوص ${currentDetailAd.title}</div>`;chatScreen.style.display="block"}
function closeChat(){chatScreen.style.display="none"}
function sendMsg(){let txt=chatInput.value.trim();if(!txt)return;chatBox.innerHTML+=`<div style="align-self:flex-end;background:#3B82F6;color:#fff;padding:10px 14px;border-radius:14px;max-width:75%">${txt}</div>`;chatInput.value=""}
function toggleFav(t){let f=JSON.parse(localStorage.getItem('makank_favs')||'[]');if(f.includes(t))f=f.filter(x=>x!==t);else f.push(t);localStorage.setItem('makank_favs',JSON.stringify(f));renderAds()}
function handleImage(i){if(i.files&&i.files[0]){let r=new FileReader();r.onload=function(e){selectedImageBase64=e.target.result;previewImg.src=selectedImageBase64;previewImg.style.display="block"};r.readAsDataURL(i.files[0])}}
let selectedImageBase64="";
function directLogin(){let n=userName.value.trim()||"باسم السيد";let p=userPhone.value.trim()||"0578701979";let e=userEmail.value.trim()||"basemnms505@gmail.com";localStorage.setItem('makank_user',JSON.stringify({name:n,phone:p,email:e}));loginScreen.style.display="none";loadProfileData()}
function checkLogin(){if(localStorage.getItem('makank_user')){loginScreen.style.display="none";loadProfileData()}}checkLogin();
function closeAll(){['profileScreen','addScreen','favScreen','msgScreen','notifScreen','detailScreen','chatScreen'].forEach(id=>{let el=document.getElementById(id);if(el)el.style.display='none'})}
function openProfile(){closeAll();loadProfileData();profileScreen.style.display="block"}
function openFavs(){closeAll();favScreen.style.display="block"}
function openMessages(){closeAll();msgScreen.style.display="block"}
function openNotifs(){closeAll();notifScreen.style.display="block"}
function goHome(){closeAll();window.scrollTo(0,0)}
function loadProfileData(){let u=JSON.parse(localStorage.getItem('makank_user')||'{}');if(!u.name)return;profileName.innerText=u.name;pName.innerText="👤 "+u.name;pPhone.innerText="📞 "+u.phone;pEmail.innerText="✉️ "+u.email;avatarLetter.innerText=u.name.charAt(0);editName.value=u.name;editPhone.value=u.phone;editEmail.value=u.email}
function saveProfile(){let n=editName.value.trim();localStorage.setItem('makank_user',JSON.stringify({name:n,phone:editPhone.value,email:editEmail.value}));loadProfileData();alert("✅ تم الحفظ");closeAll()}
function logout(){if(confirm("تسجيل خروج؟")){localStorage.removeItem('makank_user');location.reload()}}
function openAdd(){addScreen.style.display="block"}
function publishAd(){let title=adTitle.value.trim();let cat=adCat.value;let price=adPrice.value.trim();let city=adCity.value.trim()||"الرياض";let phone=adPhone.value.trim();let img=selectedImageBase64||"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=600";let desc=adDesc.value.trim()||title;if(title==""||price==""){alert("اكمل البيانات");return}let newAd={cat,title,price,city,phone:phone.replace(/^0/,'966'),img,desc};let saved=JSON.parse(localStorage.getItem('makank_ads')||'[]');saved.unshift(newAd);localStorage.setItem('makank_ads',JSON.stringify(saved));closeAll();renderAds();alert("تم النشر")}
</script>
</body>
</html>
