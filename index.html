
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكانك | السوق المصري</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7f6;font-family:Tahoma,Arial;color:#222}
header{background:#087d48;color:white;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:27px;font-weight:bold}
.logo span{color:#b8f5cf}
.location{font-size:13px;margin-top:8px}
.search{margin-top:15px;display:flex;background:white;border-radius:12px;overflow:hidden}
.search input{border:0;padding:14px;width:100%;outline:none;font-size:15px}
.search button{border:0;background:#e5f5eb;padding:0 17px;color:#087d48;font-size:19px}
.container{padding:14px;max-width:900px;margin:auto}
.add{width:100%;background:#087d48;color:white;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:bold}
h3{margin:22px 0 12px}
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{background:white;border-radius:13px;padding:13px 3px;text-align:center;border:1px solid #eee;font-size:13px}
.cat b{display:block;font-size:25px;margin-bottom:7px}
.cat:active{background:#e5f5eb}
.filters{display:flex;gap:8px;overflow:auto;margin:12px 0}
.filters button{white-space:nowrap;border:1px solid #ddd;background:white;border-radius:20px;padding:9px 15px}
.ads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ad{background:white;border-radius:12px;overflow:hidden;border:1px solid #eee}
.photo{height:125px;background:#e8eee9;display:flex;align-items:center;justify-content:center;font-size:48px}
.details{padding:10px}
.price{color:#087d48;font-weight:bold;font-size:16px}
.name{font-size:14px;font-weight:bold;margin:7px 0}
.meta{font-size:11px;color:#888}
.fav{float:left;border:0;background:none;font-size:19px}
nav{position:sticky;bottom:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:12px 3px}
nav button{border:0;background:none;font-size:12px;color:#555}
nav span{display:block;font-size:20px;margin-bottom:4px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:5;padding:15px;overflow:auto}
.form{background:white;padding:18px;border-radius:15px;max-width:450px;margin:35px auto}
.form input,.form select,.form textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font-size:14px}
.form button{width:100%;padding:13px;border:0;border-radius:9px;background:#087d48;color:white;margin-top:8px;font-size:16px}
.close{background:#eee!important;color:#222!important}
.empty{text-align:center;color:#888;padding:25px;grid-column:1/-1}
@media(min-width:650px){.ads{grid-template-columns:repeat(3,minmax(0,1fr))}.photo{height:180px}}
</style>
</head>
<body>

<header>
 <div class="top">
  <div class="logo">مكان<span>ك</span></div>
  <div>🇪🇬 مصر</div>
 </div>
 <div class="location">📍 جميع محافظات مصر</div>
 <div class="search">
  <input id="search" placeholder="ابحث عن سيارة، شقة، موبايل...">
  <button onclick="render()">⌕</button>
 </div>
</header>

<main class="container">
 <button class="add" onclick="openForm()">＋ أضف إعلانك مجاناً</button>

 <h3>الأقسام الرئيسية</h3>
 <div class="categories">
  <div class="cat" onclick="category('سيارات')"><b>🚗</b>سيارات</div>
  <div class="cat" onclick="category('عقارات')"><b>🏠</b>عقارات</div>
  <div class="cat" onclick="category('أجهزة')"><b>📱</b>أجهزة</div>
  <div class="cat" onclick="category('أثاث')"><b>🛋️</b>أثاث</div>
  <div class="cat" onclick="category('وظائف')"><b>💼</b>وظائف</div>
  <div class="cat" onclick="category('خدمات')"><b>🔧</b>خدمات</div>
  <div class="cat" onclick="category('أزياء')"><b>👕</b>أزياء</div>
  <div class="cat" onclick="category('حيوانات')"><b>🐾</b>حيوانات</div>
 </div>

 <h3>أحدث الإعلانات</h3>
 <div class="filters">
  <button onclick="category('الكل')">الكل</button>
  <button onclick="category('سيارات')">سيارات</button>
  <button onclick="category('عقارات')">عقارات</button>
  <button onclick="category('أجهزة')">أجهزة</button>
  <button onclick="category('أثاث')">أثاث</button>
 </div>

 <div class="ads" id="ads"></div>
</main>

<div class="modal" id="modal">
 <div class="form">
  <h3>إضافة إعلان جديد</h3>
  <input id="title" placeholder="عنوان الإعلان">
  <input id="price" type="number" placeholder="السعر بالجنيه المصري">
  <select id="cat">
   <option>سيارات</option><option>عقارات</option>
   <option>أجهزة</option><option>أثاث</option>
   <option>وظائف</option><option>خدمات</option>
   <option>أزياء</option><option>حيوانات</option>
  </select>
  <select id="city">
   <option>القاهرة</option><option>الجيزة</option>
   <option>الإسكندرية</option><option>القليوبية</option>
   <option>الشرقية</option><option>الدقهلية</option>
   <option>المنوفية</option><option>الغربية</option>
   <option>البحيرة</option><option>الفيوم</option>
   <option>بني سويف</option><option>المنيا</option>
   <option>أسيوط</option><option>سوهاج</option>
   <option>قنا</option><option>الأقصر</option>
   <option>أسوان</option><option>بورسعيد</option>
   <option>السويس</option><option>الإسماعيلية</option>
   <option>دمياط</option><option>كفر الشيخ</option>
   <option>شمال سيناء</option><option>جنوب سيناء</option>
   <option>مطروح</option><option>البحر الأحمر</option>
   <option>الوادي الجديد</option>
  </select>
  <textarea id="desc" placeholder="تفاصيل الإعلان"></textarea>
  <input id="phone" placeholder="رقم الهاتف" type="tel">
  <button onclick="addAd()">نشر الإعلان</button>
  <button class="close" onclick="closeForm()">إلغاء</button>
 </div>
</div>

<nav>
 <button onclick="category('الكل')"><span>🏠</span>الرئيسية</button>
 <button onclick="openForm()"><span>➕</span>أضف إعلان</button>
 <button onclick="alert('قسم المفضلة')"><span>❤️</span>المفضلة</button>
 <button onclick="alert('قريباً: حسابك الشخصي')"><span>👤</span>حسابي</button>
</nav>

<script>
let ads=JSON.parse(localStorage.getItem('makank_ads')||'[]');
let selected='الكل';

const icons={
'سيارات':'🚗','عقارات':'🏠','أجهزة':'📱',
'أثاث':'🛋️','وظائف':'💼','خدمات':'🔧',
'أزياء':'👕','حيوانات':'🐾'
};

function save(){
 localStorage.setItem('makank_ads',JSON.stringify(ads));
}

function category(c){
 selected=c;
 render();
 window.scrollTo({top:400,behavior:'smooth'});
}

function render(){
 let q=document.getElementById('search').value.trim().toLowerCase();
 let list=ads.filter(a=>
 (selected==='الكل'||a.cat===selected)&&
 (a.title+a.city+a.desc+a.cat).toLowerCase().includes(q)
 );
 document.getElementById('ads').innerHTML=list.length?list.map(a=>`
 <div class="ad">
  <div class="photo">${icons[a.cat]||'📦'}</div>
  <div class="details">
   <button class="fav" onclick="alert('يمكن تفعيل المفضلة بعد تسجيل الدخول')">♡</button>
   <div class="price">${Number(a.price).toLocaleString('ar-EG')} جنيه</div>
   <div class="name">${escapeHTML(a.title)}</div>
   <div class="meta">📍 ${escapeHTML(a.city)} · ${escapeHTML(a.cat)}</div>
   <p style="font-size:12px">${escapeHTML(a.desc)}</p>
   <button onclick="contact('${a.phone}')" style="border:0;background:#e5f5eb;color:#087d48;padding:8px;border-radius:8px;width:100%">اتصل بالبائع</button>
  </div>
 </div>`).join(''):'<div class="empty">لا توجد إعلانات حالياً في هذا القسم</div>';
}

function escapeHTML(s){
 return String(s||'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 })[c]);
}

function contact(phone){
 if(/^[0-9+ ]{8,20}$/.test(phone)){
  location.href='tel:'+phone.replace(/ /g,'');
 }else{
  alert('رقم الهاتف غير صحيح');
 }
}

function openForm(){
 document.getElementById('modal').style.display='block';
}
function closeForm(){
 document.getElementById('modal').style.display='none';
}

function addAd(){
 let title=document.getElementById('title').value.trim();
 let price=document.getElementById('price').value;
 let phone=document.getElementById('phone').value.trim();
 if(!title||!price||!phone){
  alert('من فضلك أكمل العنوان والسعر ورقم الهاتف');
  return;
 }
 if(!/^[0-9+ ]{8,20}$/.test(phone)){
  alert('تأكد من رقم الهاتف');
  return;
 }
 ads.unshift({
  title,price,phone,
  cat:document.getElementById('cat').value,
  city:document.getElementById('city').value,
  desc:document.getElementById('desc').value
 });
 save();
 document.querySelectorAll('.form input,.form textarea').forEach(x=>x.value='');
 closeForm();
 selected='الكل';
 render();
 alert('تم حفظ إعلانك على هذا الجهاز');
}
render();
</script>
</body>
</html>
